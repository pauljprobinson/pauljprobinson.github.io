<footer class="footer flex-shrink-0 border-top py-2 mt-5 bg-white small">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <div class="row my-3">
            <div class="col-6">
                <div class="text-muted">
                    <i>Last updated: {{ "now" | date: "%b %Y" }}</i>
                </div>
                <div class="footer-credit">
                    <a href="https://github.com/luost26/academic-homepage" target="_blank">Built with academic-homepage</a>
                </div>
            </div>
            <div class="col-6">
                <div class="text-right text-muted">
                    &copy; {{ "now" | date: "%Y" }} {{ site.data.profile.copyright_name | default: site.data.profile.primary_name }}
                </div>
            </div>
        </div>
    </div>
</footer>
