short_bio: >-
  <p>
  I am a theoretical and computational chemist whose research has covered
  a wide range of areas including quantum dynamics, electronic structure, strongly correlated materials, and chemical bonding. 
  In general, my research interests encompass the understanding, discovery, and application of correlated materials. 
  In particular, I seek to design tools and ask questions which lead to new and intuitive chemical understandings of these frontier materials.
  </p><p>
  I am currently an Arnold O. Beckman Postdoctoral Fellow in Chemical Sciences at Harvard University mentored by Joonho Lee. 
  I received my PhD in Chemical Physics from Columbia University where I was an NSF Graduate Research Fellow under the direction of David Reichman. 
  There, my thesis was <i>Structure and Dynamics in Electron-Phonon Coupled Materials</i>.
  Prior to that I received my BS in Physics <i>cum laude</i> from UCLA where I worked under Anastassia Alexandrova. 
  I additionally spent summers working under Eric Neuscamman at UC Berkeley and Garnet Chan at Caltech. 
  </p><p>
  My work has been recognized by a number of awards including the 
  Wiley Computers in Chemistry Outstanding Postdoc Award, 
  the Chemical Computing Group Excellence Award, 
  and the Pegram Award from the Columbia University Chemistry department.
  </p>

