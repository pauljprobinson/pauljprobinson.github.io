# Research areas. The homepage lists these and expands the key publications for each.
# The full version of this file - descriptions, figures and video - is kept locally
# in _data/research.yml.bak until the research page is ready to publish.
#   title  - heading shown on the homepage
#   key    - publications with a matching `representative:` belong to this area
#   figure - optional image or mp4 shown under the publications in the dropdown
#   figure_width  - how wide it may run, as a fraction of the text above it (default 75%)
#   figure_height - how tall it may run (default 12rem); raise it for tall figures
areas:
- title: Electron-Phonon Interactions
  key: eph
  figure: /assets/images/research_images/epi_fig.jpg
- title: Non-Covalent Interactions
  key: nci
  figure: /assets/images/research_images/nci_fig.png
  figure_width: 65%
  figure_height: 20rem
- title: Chemical Bonding in Solids
  key: bonding
  figure: /assets/images/research_images/bond_fig.jpg
- title: Electronic-Structure Development
  key: method
  figure: /assets/images/research_images/dev_fig.jpg
  figure_width: 50%
