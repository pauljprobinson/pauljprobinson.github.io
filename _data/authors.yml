# Styling for author names as they appear in publication entries.
# The key must match the name exactly as written in a publication's `authors` list
# (a trailing * for equal contribution or # for corresponding author is stripped first).
#   bold: true  - highlight (used for yourself)
#   url:        - link the name to a homepage
#   name:       - display a different string than the key

"P. J. Robinson":
  bold: true
